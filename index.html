<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#f7c9dc">

  <title>Leyla 🐾</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- TOP BAR -->
    <header class="top-bar">

      <div class="logo">
        <span>🐾</span>
        <strong>Leyla</strong>
      </div>

      <div class="coins">
        🪙 <span id="coins-value">100</span>
      </div>

    </header>


    <!-- HOME -->
    <section
      id="home-screen"
      class="screen active"
    >

      <!-- Mood -->
      <div class="status-area">

        <div class="mood-pill">
          <span id="mood-icon">😺</span>
          <span id="mood-text">Happy</span>
        </div>

        <p id="status-text">
          Leyla is looking at you...
        </p>

      </div>


      <!-- Stats -->
      <div class="stats">

        <div class="stat-card">
          <span>🍗</span>

          <div class="stat-content">
            <small>Hunger</small>

            <div class="progress">
              <div
                id="hunger-bar"
                class="progress-fill hunger"
              ></div>
            </div>
          </div>

          <strong id="hunger-value">80</strong>
        </div>


        <div class="stat-card">
          <span>💧</span>

          <div class="stat-content">
            <small>Thirst</small>

            <div class="progress">
              <div
                id="thirst-bar"
                class="progress-fill thirst"
              ></div>
            </div>
          </div>

          <strong id="thirst-value">80</strong>
        </div>


        <div class="stat-card">
          <span>❤️</span>

          <div class="stat-content">
            <small>Happy</small>

            <div class="progress">
              <div
                id="happiness-bar"
                class="progress-fill happiness"
              ></div>
            </div>
          </div>

          <strong id="happiness-value">80</strong>
        </div>


        <div class="stat-card">
          <span>⚡</span>

          <div class="stat-content">
            <small>Energy</small>

            <div class="progress">
              <div
                id="energy-bar"
                class="progress-fill energy"
              ></div>
            </div>
          </div>

          <strong id="energy-value">80</strong>
        </div>

      </div>


      <!-- ROOM -->
      <div
        id="room"
        class="room"
      >

        <!-- Window -->
        <div class="window">
          <div class="window-sky"></div>
          <div class="window-frame vertical"></div>
          <div class="window-frame horizontal"></div>
        </div>


        <!-- Wall decoration -->
        <div class="wall-picture">
          🖼️
        </div>


        <!-- Cat tower -->
        <div
          class="room-object cat-tower"
          data-object="tower"
        >
          🪵
        </div>


        <!-- Yarn -->
        <button
          class="room-object toy-object"
          data-object="toy"
          aria-label="Yarn toy"
        >
          🧶
        </button>


        <!-- Food -->
        <button
          class="room-object food-object"
          data-object="food"
          aria-label="Food bowl"
        >
          🍗
        </button>


        <!-- Water -->
        <button
          class="room-object water-object"
          data-object="water"
          aria-label="Water bowl"
        >
          💧
        </button>


        <!-- Bed -->
        <button
          class="room-object bed-object"
          data-object="bed"
          aria-label="Bed"
        >
          🛏️
        </button>


        <!-- Floor rug -->
        <div class="rug"></div>


        <!-- Leyla -->
        <div
          id="cat-wrapper"
          class="cat-wrapper"
        >

          <div class="cat-3d">

            <div class="cat-depth"></div>

            <img
              id="cat-img"
              src="images/leyla_normal.png"
              alt="Leyla"
              draggable="false"
            >

          </div>

        </div>


        <!-- Interaction bubble -->
        <div
          id="action-bubble"
          class="action-bubble"
        >
          🐾
        </div>


        <!-- Particles -->
        <div
          id="particles-container"
          class="particles-container"
        ></div>

      </div>


      <!-- Actions -->
      <div class="actions-grid">

        <button
          class="action-btn"
          data-action="feed"
        >
          <span>🍗</span>
          <small>Feed</small>
        </button>

        <button
          class="action-btn"
          data-action="water"
        >
          <span>💧</span>
          <small>Water</small>
        </button>

        <button
          class="action-btn"
          data-action="pet"
        >
          <span>❤️</span>
          <small>Pet</small>
        </button>

        <button
          class="action-btn"
          data-action="treat"
        >
          <span>🦴</span>
          <small>Treat</small>
        </button>

        <button
          class="action-btn"
          data-action="play"
        >
          <span>🧶</span>
          <small>Play</small>
        </button>

        <button
          class="action-btn"
          data-action="sleep"
        >
          <span>😴</span>
          <small>Sleep</small>
        </button>

        <button
          class="action-btn danger"
          data-action="scare"
        >
          <span>🥒</span>
          <small>Scare</small>
        </button>

        <button
          class="action-btn danger"
          data-action="poke"
        >
          <span>👉</span>
          <small>Poke</small>
        </button>

      </div>

    </section>


    <!-- GAMES -->
    <section
      id="games-screen"
      class="screen"
    >

      <div class="page-title">
        <h2>🎮 Play with Leyla</h2>
        <p>Choose a game</p>
      </div>


      <button
        class="game-card"
        data-game="yarn"
      >

        <div class="game-card-icon">
          🧶
        </div>

        <div class="game-card-content">
          <h3>Catch the Yarn</h3>
          <p>Move the yarn and let Leyla catch it!</p>
        </div>

        <span class="game-arrow">›</span>

      </button>


      <button
        class="game-card"
        data-game="fish"
      >

        <div class="game-card-icon">
          🐟
        </div>

        <div class="game-card-content">
          <h3>Catch the Fish</h3>
          <p>Tap the fish before they disappear!</p>
        </div>

        <span class="game-arrow">›</span>

      </button>

    </section>


    <!-- GAME SCREEN -->
    <section
      id="game-screen"
      class="screen"
    >

      <div class="game-header">

        <button
          id="back-game-btn"
          class="back-btn"
        >
          ‹ Back
        </button>

        <h2 id="game-title">
          Game
        </h2>

        <div id="game-score">
          0
        </div>

      </div>

      <div
        id="game-area"
        class="game-area"
      ></div>

    </section>


    <!-- NAVIGATION -->
    <nav class="bottom-nav">

      <button
        class="nav-btn active"
        data-screen="home-screen"
      >
        <span>🏠</span>
        <small>Home</small>
      </button>

      <button
        class="nav-btn"
        data-screen="games-screen"
      >
        <span>🎮</span>
        <small>Games</small>
      </button>

    </nav>

  </main>


  <script src="games/yarn.js"></script>
  <script src="games/fish.js"></script>
  <script src="room/room.js"></script>
  <script src="app.js"></script>

</body>
</html>
